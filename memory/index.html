<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f2">
  <meta name="description" content="Play Memory for free. No ads, accounts, or tracking. A tiny open-source browser game from OpenGames.">
  <title>Memory — OpenGames</title>
  <link rel="icon" href="../shared/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../shared/style.css">
  <link rel="stylesheet" href="style.css">
  <script src="../shared/audio.js" defer></script>
  <script src="../shared/ui.js" defer></script>
  <script src="../shared/input.js" defer></script>
  
  <script src="game.js" defer></script>
</head>
<body class="game-page" data-game="memory">
  <a class="skip-link" href="#main">Skip to game</a>
  <header class="game-header">
    <a class="back-link" href="../index.html">← All games</a>
    <h1>Memory</h1>
  </header>
  <main id="main" class="game-main">
    <div class="game-layout" aria-label="Memory">
      <div class="play-area">
        <div id="board" class="board memory-board" aria-label="Memory game board" tabindex="-1"></div>
        <div id="overlay" class="overlay" role="region" aria-labelledby="overlay-title" hidden>
          <h2 id="overlay-title"></h2>
          <p id="overlay-message"></p>
          <button id="overlay-action" type="button" class="primary">Play again</button>
        </div>
      </div>
      <div class="stats" aria-label="Game statistics"><div class="stat"><span class="stat-label">Moves</span><span id="moves" class="stat-value">0</span></div><div class="stat"><span class="stat-label">Pairs</span><span id="pairs" class="stat-value">0 / 8</span></div><div class="stat"><span class="stat-label">Time</span><span id="time" class="stat-value">0:00</span></div></div>
      <div class="game-toolbar" aria-label="Game controls">
        <div class="primary-controls">
          <button id="pause" type="button" aria-pressed="false">Pause</button>
          <button id="restart" type="button">Restart</button>
        </div>
        <div class="view-controls">
          <details id="settings" class="game-settings">
            <summary class="icon-button" aria-label="Settings and controls" title="Settings and controls">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--paper)"/><circle cx="15" cy="17" r="3" fill="var(--paper)"/></svg>
            </summary>
            <div class="settings-content">
              <p class="settings-label">Difficulty</p>
              <div class="difficulty" role="group" aria-label="Difficulty (starts a new game)">
                <button type="button" data-difficulty="easy" aria-pressed="false">Easy</button>
                <button type="button" data-difficulty="normal" aria-pressed="true">Normal</button>
                <button type="button" data-difficulty="hard" aria-pressed="false">Hard</button>
              </div>
              <button id="sound" type="button" aria-pressed="false">Sound off</button>
              <p id="control-hint" class="control-hint">Tap a card · Arrow keys to move between cards · Enter or Space to flip<br>R to restart · Esc to pause / exit fullscreen</p>
            </div>
          </details>
          <button id="fullscreen" class="icon-button" type="button" aria-label="Fullscreen" title="Fullscreen" aria-pressed="false">
            <svg class="expand-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg>
            <svg class="collapse-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h5V3m8 0v5h5M8 21v-5H3m13 5v-5h5"/></svg>
          </button>
        </div>
      </div>

    </div>
    <p id="announcement" class="sr-only" role="status" aria-live="polite"></p>
    <noscript><p>This game needs JavaScript enabled in your browser.</p></noscript>
  </main>
</body>
</html>
